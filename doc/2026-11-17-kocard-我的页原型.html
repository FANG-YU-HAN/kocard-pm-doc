<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kocard 我的页原型</title>
<style>
  :root {
    --ink: #141519;
    --muted: #8a8f98;
    --faint: #a6aab1;
    --line: #e9e9ed;
    --line-soft: #ededf0;
    --card: #fafafa;
    --soft: #f2f2f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 24px 40px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .doc-head {
    max-width: 720px;
    margin: 0 auto 20px;
    text-align: center;
  }
  .doc-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .doc-meta {
    margin-top: 8px;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: .04em;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .device { margin: 0; }

  .phone-shell {
    position: relative;
    width: 261px;
    height: 568px;
  }
  .phone {
    position: absolute;
    top: 0;
    left: 0;
    width: 402px;
    height: 874px;
    border: 1px solid #d7dce3;
    border-radius: 52px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(14, 17, 22, .04);
    transform: scale(.65);
    transform-origin: top left;
  }
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    border: 1px solid #d7dce3;
    border-radius: 18px;
    z-index: 5;
  }
  .status {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px 0 40px;
  }
  .time { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .status-icons { display: flex; align-items: center; gap: 6px; }

  .header {
    height: 52px;
    margin-top: 6px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .chev-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: none;
    display: grid;
    place-items: center;
    color: #3c3f45;
  }

  .content {
    position: absolute;
    left: 24px;
    right: 24px;
    top: 112px;
    bottom: 24px;
    padding: 2px 0 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .ic {
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chev {
    width: 16px;
    height: 16px;
    margin-left: auto;
    flex: none;
    fill: none;
    stroke: #b9bcc2;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform .18s ease;
  }

  /* 会员卡 */
  .member-card {
    position: relative;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
  }
  .member-top { display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 24px;
    height: 24px;
    border: 1px solid #d9d9de;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 500;
    color: #6f6f76;
  }
  .member-name { font-size: 12px; color: #5f636a; }
  .member-level {
    margin-top: 12px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 28px;
  }
  .member-expiry { margin-top: 5px; font-size: 11px; color: var(--muted); }
  .badge {
    position: absolute;
    top: 44px;
    right: 16px;
    width: 44px;
    height: 48px;
  }
  .renew-btn {
    position: relative;
    margin-top: 16px;
    width: 100%;
    height: 44px;
    border: 0;
    border-radius: 12px;
    background: #141519;
    color: #fff;
    font-size: 14px;
  }
  .renew-btn .ring {
    position: absolute;
    top: 50%;
    right: 15px;
    width: 19px;
    height: 19px;
    transform: translateY(-50%);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 50%;
  }

  /* AI 积分 */
  .credits-card {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    margin-top: 12px;
    padding: 0 10px 0 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
  }
  .credits-card .ic { width: 18px; height: 18px; stroke-width: 1.4; }
  .credits-label { font-size: 14px; }
  .credits-value { margin-left: auto; font-size: 15px; font-variant-numeric: tabular-nums; }
  .charge-btn {
    height: 26px;
    padding: 0 12px;
    border: 1px solid #e5e5e9;
    border-radius: 13px;
    background: #fff;
    font-size: 12px;
    color: var(--ink);
  }

  /* 设置列表 */
  .menu-card {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    overflow: hidden;
  }
  .menu-row {
    position: relative;
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border: 0;
    background: none;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    text-align: left;
  }
  .menu-row.line::before {
    content: "";
    position: absolute;
    top: 0;
    left: 46px;
    right: 14px;
    height: 1px;
    background: var(--line-soft);
  }
  .menu-row.is-open .chev { transform: rotate(90deg); }

  .sub-panel {
    margin: 0 14px 10px;
    border-radius: 12px;
    background: var(--soft);
    overflow: hidden;
  }
  .sub-row {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 0;
    background: none;
    display: flex;
    align-items: center;
    font-size: 13.5px;
    text-align: left;
  }
  .sub-row + .sub-row { border-top: 1px solid #e8e8eb; }
  .sub-row .chev { width: 15px; height: 15px; }

  .logout-btn {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 40px;
    height: 44px;
    border: 1px solid #e5e5e9;
    border-radius: 22px;
    background: #fff;
    font-size: 13px;
    color: #232529;
  }

  .home-indicator {
    position: absolute;
    left: 50%;
    bottom: 9px;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    border-radius: 3px;
    background: #0e1116;
  }

  /* ---------- 漫画风格相关页 ---------- */
  .header--sub { justify-content: flex-start; gap: 10px; }
  .header--sub .page-title { font-size: 16px; }
  .back-btn {
    width: 26px;
    height: 26px;
    margin-left: -5px;
    padding: 0;
    border: 0;
    background: none;
    display: grid;
    place-items: center;
    color: var(--ink);
  }

  .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mode-card {
    position: relative;
    height: 96px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    text-align: left;
  }
  .mode-card.is-active { border: 1.5px solid var(--ink); padding: 13.5px; }
  .mode-card .ic { width: 20px; height: 20px; }
  .mode-name { font-size: 14px; }
  .radio {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 18px;
    height: 18px;
    border: 1px solid #cfd2d7;
    border-radius: 50%;
    background: #fff;
  }
  .radio--on {
    display: grid;
    place-items: center;
    background: var(--ink);
    border-color: var(--ink);
  }

  .auto-card {
    height: 548px;
    margin-top: 14px;
    padding: 34px 24px 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .auto-spark { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
  .auto-title { margin-top: 18px; font-size: 18px; font-weight: 600; }
  .auto-desc {
    margin: 12px 0 0;
    max-width: 310px;
    font-size: 11.5px;
    line-height: 1.95;
    color: #6f747c;
  }
  .auto-samples { margin-top: 22px; display: flex; align-items: center; gap: 13px; }
  .auto-samples img { height: 70px; width: auto; border-radius: 9px; display: block; }

  .cat-card {
    height: 196px;
    margin-top: 12px;
    padding: 20px 0 20px 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    overflow: hidden;
  }
  .cat-top { display: flex; align-items: center; padding-right: 16px; }
  .cat-top .ic { width: 20px; height: 20px; }
  .cat-count {
    margin-left: auto;
    padding: 0;
    border: 0;
    background: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .cat-count svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: #b9bcc2;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .cat-title { margin-top: 12px; font-size: 17px; font-weight: 600; }
  .cat-desc { margin-top: 7px; font-size: 11px; color: var(--muted); }
  .cat-strip { display: block; margin-top: 14px; height: auto; }
  .cat-strip--single { width: 314px; }
  .cat-strip--story { width: 291px; }

  .style-strip { display: block; margin: 0 auto; }
  .style-strip--single { width: 314px; }
  .style-strip--story { width: 260px; }
  .style-caption { margin-top: 18px; text-align: center; font-size: 11px; color: var(--muted); }
  .style-count { margin-top: 6px; text-align: center; font-size: 12px; color: #3f434a; }
  .style-grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 14px;
    row-gap: 16px;
  }
  .style-item { display: flex; flex-direction: column; align-items: center; }
  .style-item img { width: 100%; height: auto; display: block; border-radius: 11px; }
  .style-label { margin-top: 8px; font-size: 12px; color: #4b5058; }

  .sep {
    width: 100%;
    max-width: 560px;
    height: 1px;
    background: #e6eaf0;
    margin: 40px 0;
  }

  .fig {
    margin: 12px 0 0;
    text-align: center;
    font-size: 11px;
    color: #9aa1ab;
  }
</style>
</head>
