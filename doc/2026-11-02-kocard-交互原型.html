<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kocard 交互原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #0e1116;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px 40px;
  }
  button { font-family: inherit; }
  .phone {
    position: relative;
    width: 402px;
    height: 874px;
    zoom: .9;
    flex: none;
    border: 1px solid #d7dce3;
    border-radius: 52px;
    background: #fff;
    overflow: hidden;
  }
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    border: 1px solid #d7dce3;
    border-radius: 18px;
    background: #fff;
    z-index: 81;
  }
  .status {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px 0 40px;
    background: #fff;
    pointer-events: none;
  }
  .time { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .screens { position: absolute; inset: 0; overflow: hidden; }
  .screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    padding-top: 54px;
    display: flex;
    flex-direction: column;
    background: #fff;
    transform: translateX(100%);
    transition: transform .32s cubic-bezier(.4, 0, .2, 1);
    pointer-events: none;
  }
  .screen.on { transform: none; pointer-events: auto; }
  .screen.root {
    z-index: 1;
    transform: none;
    opacity: 0;
    transition: opacity .18s;
    pointer-events: none;
  }
  .screen.root.on { opacity: 1; pointer-events: auto; }
  .header {
    flex: none;
    height: 52px;
    margin-top: 6px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .nav { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .back { width: 24px; height: 24px; flex: none; display: grid; place-items: center; cursor: pointer; }
  .page-title {
    min-width: 0;
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title-arrow { color: #9aa1ab; font-weight: 400; }
  .avatar {
    width: 32px;
    height: 32px;
    flex: none;
    border: 1px solid #d7dce3;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .avatar svg { width: 18px; height: 18px; }
  .gear { width: 24px; height: 24px; flex: none; display: grid; place-items: center; cursor: pointer; }
  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 20px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }
  .content.root-content { padding-bottom: 132px; }
  .section { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { border: 1px solid #dfe3e9; border-radius: 16px; background: #fff; }
  .st-ic {
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .st-ic.lg { stroke-width: 1.4; }

  /* 首页 */
  .jobs { display: flex; flex-direction: column; gap: 10px; }
  .job {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .job:active { border-color: #c9ced6; }
  .job-head { display: flex; align-items: center; }
  .job-head-main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .job-title {
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .job-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 18px;
    padding: 0 7px;
    flex: none;
    border: 1px solid #dfe3e9;
    border-radius: 9px;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
  }
  .job-tag.off { color: #9aa1ab; }
  .job-tag .st-ic { width: 10px; height: 10px; }
  .job-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 30px;
    font-size: 12px;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
  }
  .job-state { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .job-state > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-state .st-ic { width: 12px; height: 12px; }
  .cs-btn {
    height: 30px;
    padding: 0 14px;
    flex: none;
    border: 1px solid #d7dce3;
    border-radius: 15px;
    background: #fff;
    font-size: 12px;
    color: #0e1116;
    cursor: pointer;
  }
  .cs-btn:active { background: #f4f6f9; }
  .add-block { display: flex; flex-direction: column; gap: 10px; }
  .add-sep { width: 32px; height: 1px; margin: 6px auto 0; background: #dfe3e9; }
  .add-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-mini { padding: 15px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .add-mini .h0-ic { width: 28px; height: 28px; }
  .add-mini .h0-ic svg { width: 26px; height: 26px; }
  .add-mini .h0-t { font-size: 16px; }
  .h0-row {
    height: 100px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
  }
  .h0-ic { flex: none; width: 42px; height: 42px; display: grid; place-items: center; }
  .h0-tx { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .h0-t { font-size: 18px; font-weight: 600; line-height: 1.25; }
  .h0-row .h0-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 详情状态卡 */
  .status-card { padding: 22px 18px; }
  .status-card.noact { padding-top: 40px; padding-bottom: 40px; }
  .cs-row { display: flex; align-items: center; gap: 6px; min-height: 24px; }
  .cs-ic { width: 16px; height: 16px; }
  .cs-num { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; }
  .cs-num .v { font-size: 20px; }
  .cs-num .u { font-size: 13px; font-weight: 400; color: #6b7280; }
  .cs-size { margin-left: auto; font-size: 13px; color: #6b7280; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cs-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 11px;
    padding-left: 22px;
    font-size: 13px;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
  }
  .cs-sub { margin-top: 11px; padding-left: 22px; font-size: 12px; line-height: 1.5; color: #6b7280; }
  .status-card .cs-btn {
    display: block;
    width: 100%;
    height: 44px;
    margin: 14px 0 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
  }

  /* 磁盘卡 */
  .disk-files { overflow: hidden; }
  .disk-files-main { display: flex; flex-direction: column; gap: 16px; padding: 22px 18px; }
  .disk-files-main.slim { gap: 14px; }
  .disk-files-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .disk-name { min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .disk-open {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex: none;
    padding: 0;
    border: 0;
    background: none;
    font-size: 12px;
    color: #0e1116;
    cursor: pointer;
  }
  .disk-cap { display: flex; flex-direction: column; gap: 10px; }
  .disk-bar { height: 4px; border-radius: 2px; background: #eef1f4; overflow: hidden; }
  .disk-bar > i { display: block; height: 100%; border-radius: 2px; background: #9aa1ab; }
  .disk-cap-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .disk-state { font-size: 12px; color: #8a9099; font-variant-numeric: tabular-nums; }
  .disk-files-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .disk-status { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; }
  .disk-status .st-ic { width: 12px; height: 12px; }
  .disk-status.off { color: #9aa1ab; font-weight: 400; }
  .disk-fs { font-size: 11px; color: #8a9099; }

  /* 记录 */
  .hist-card { overflow: hidden; }
  .hist-list .row { height: 44px; }

  /* 设置列表 */
  .list { display: flex; flex-direction: column; }
  .row {
    height: 48px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
  }
  .row + .row { border-top: 1px solid #eef1f4; }
  .row .k { color: #6b7280; flex: none; }
  .row .v {
    min-width: 0;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .v + .st-ic { color: #9aa1ab; }
  .row--name .v { margin-left: auto; }
  .row--link { cursor: pointer; }
  .row--link:active { background: #fafbfc; }
  .row--danger { color: #dc2626; cursor: pointer; }
  .hint { padding: 0 16px; font-size: 12px; line-height: 1.5; color: #8a9099; }
  .hint--c { padding: 0; text-align: center; }
  .switch {
    position: relative;
    flex: none;
    width: 44px;
    height: 26px;
    border-radius: 13px;
    background: #0e1116;
    cursor: pointer;
    transition: background .18s;
  }
  .switch i {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: left .18s, right .18s;
  }
  .switch.off { background: #dfe3e9; }
  .switch.off i { left: 3px; right: auto; }

  /* 底部按钮 */
  .foot {
    flex: none;
    padding: 10px 24px 34px;
    display: flex;
    gap: 10px;
    background: #fff;
  }
  .btn {
    flex: 1;
    height: 48px;
    padding: 0 16px;
    border: 1px solid #0e1116;
    border-radius: 12px;
    background: #fff;
    color: #0e1116;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.primary { background: #0e1116; color: #fff; }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .btn:active { opacity: .75; }

  /* 页签 */
  .tabbar {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 34px;
    height: 58px;
    z-index: 70;
    display: flex;
    align-items: center;
    border: 1px solid #dfe3e9;
    border-radius: 29px;
    background: #fff;
    transition: opacity .18s, transform .18s;
  }
  .tabbar.hide { opacity: 0; transform: translateY(10px); pointer-events: none; }
  .tabbar .pill {
    position: absolute;
    left: 4px;
    top: 4px;
    bottom: 4px;
    width: calc((100% - 8px) / 3);
    border: 1px solid #0e1116;
    border-radius: 25px;
    transition: transform .28s cubic-bezier(.4, 0, .2, 1);
  }
  .tab {
    position: relative;
    z-index: 1;
    flex: 1;
    height: 100%;
    line-height: 56px;
    text-align: center;
    font-size: 12px;
    color: #8a9099;
    cursor: pointer;
  }
  .tab.active { color: #0e1116; font-weight: 600; }
  .home-indicator {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    border-radius: 3px;
    background: #0e1116;
    z-index: 100;
  }

  /* 任务页 */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    cursor: pointer;
  }
  .task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .task-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta {
    font-size: 11.5px;
    color: #8a9099;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip {
    flex: none;
    padding: 0 7px;
    font-size: 10px;
    line-height: 18px;
    border: 1px solid #dfe3e9;
    border-radius: 9px;
    color: #6b7280;
    white-space: nowrap;
  }
  .chip.on { color: #0e1116; border-color: #c9ced6; }
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 110px 0 60px;
    color: #9aa1ab;
    font-size: 13px;
    text-align: center;
  }
  .empty svg { width: 40px; height: 40px; opacity: .55; }
  .phase-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .phase-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
  .phase-head .pct { color: #6b7280; font-variant-numeric: tabular-nums; }
  .phase-bar { height: 4px; border-radius: 2px; background: #eef1f4; overflow: hidden; }
  .phase-bar > i { display: block; height: 100%; border-radius: 2px; background: #0e1116; }
  .phase-state { font-size: 11.5px; color: #8a9099; }

  /* AI tab */
  .ask {
    height: 140px;
    padding: 16px 12px 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid #dfe3e9;
    border-radius: 16px;
    background: #fff;
  }
  .ask input {
    width: 100%;
    height: 22px;
    padding: 0;
    border: 0;
    outline: 0;
    background: none;
    font: inherit;
    font-size: 14px;
    color: #0e1116;
  }
  .ask input::placeholder { color: #9aa1ab; }
  .ask-foot { display: flex; align-items: center; justify-content: space-between; }
  .ask-tools { display: flex; align-items: center; gap: 8px; }
  .ask-attach {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid #dfe3e9;
    border-radius: 50%;
    background: none;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .ask-model {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid #dfe3e9;
    border-radius: 14px;
    background: none;
    font-size: 12px;
    color: #0e1116;
    cursor: pointer;
  }
  .ask-send {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #f1f3f6;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .h0-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .h0-small {
    height: 180px;
    padding: 24px 30px 0 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    cursor: pointer;
  }
  .h0-small .h0-ic { width: 32px; height: 32px; }
  .h0-small .h0-tx { gap: 12px; }
  .h0-small .h0-t { font-size: 16px; }
  .h0-small .h0-s { font-size: 10px; line-height: 1.5; color: #8a9099; }

  /* 选择盘 / 创建 */
  .pick-title { font-size: 17px; font-weight: 600; }
  .pick-sub { margin-top: -4px; font-size: 12px; line-height: 1.5; color: #8a9099; }
  .pick-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .pick-row + .pick-row { border-top: 1px solid #eef1f4; }
  .pick-ico {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #f2f4f7;
    display: grid;
    place-items: center;
  }
  .pick-main { flex: 1; min-width: 0; }
  .pick-name { font-size: 13px; font-weight: 600; }
  .pick-meta { margin-top: 3px; font-size: 11px; color: #8a9099; }
  .radio {
    flex: none;
    width: 20px;
    height: 20px;
    border: 1px solid #c9ced6;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: transparent;
  }
  .pick-row.on .radio { border-color: #0e1116; background: #0e1116; color: #fff; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid #e4e8ee; border-radius: 15px; }
  .seg .ct {
    height: 26px;
    padding: 0 14px;
    border: 0;
    border-radius: 13px;
    background: none;
    font-size: 12px;
    color: #6b7280;
    cursor: pointer;
  }
  .seg .ct.on { background: #0e1116; color: #fff; font-weight: 600; }
  .folder-row { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 10px 16px; cursor: pointer; }
  .folder-ico {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: #f2f4f7;
    display: grid;
    place-items: center;
  }
  .folder-main { flex: 1; min-width: 0; }
  .folder-name { font-size: 13px; font-weight: 600; }
  .folder-path { margin-top: 2px; font-size: 11px; color: #8a9099; }
  .filetype-row { display: flex; gap: 8px; padding: 4px 16px 12px 50px; }
  .filetype {
    height: 30px;
    padding: 0 12px;
    border: 1px solid #dfe3e9;
    border-radius: 15px;
    background: #fff;
    font-size: 12px;
    color: #6b7280;
    cursor: pointer;
  }
  .filetype.on { border-color: #0e1116; color: #0e1116; font-weight: 600; }

  /* AI 推荐 */
  .rec-stats { display: flex; gap: 20px; padding-bottom: 14px; border-bottom: 1px solid #eef1f4; }
  .rec-stat { flex: 1; }
  .rec-stat .k { font-size: 12px; color: #8a9099; }
  .rec-stat .v { margin-top: 2px; font-size: 17px; font-weight: 600; }
  .rec-seg { align-self: center; margin: 12px 0 15px; }
  .rec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .rec-tile {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    background: #f1f3f6;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: #a3a9b2;
  }
  .rec-tile:nth-child(3n+2) { background: #eef0f3; }
  .rec-tile:nth-child(3n) { background: #eaedf1; }
  .rec-tile > svg { width: 26px; height: 26px; }
  .rec-check {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    border: 1px solid #c9ced6;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    color: transparent;
  }
  .rec-tile.on .rec-check { background: #0e1116; border-color: #0e1116; color: #fff; }
  .rec-tile.on::after { content: ""; position: absolute; inset: 0; border: 2px solid #0e1116; border-radius: 8px; pointer-events: none; }
  .rec-ai {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .92);
    display: grid;
    place-items: center;
    color: #0e1116;
  }
  .rec-ai svg { width: 12px; height: 12px; }

  /* AI 修图 */
  .chat-legal { flex: none; padding: 4px 0 2px; text-align: center; font-size: 10px; color: #a3a9b2; }
  .chat-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: none;
  }
  .chat-body::-webkit-scrollbar { display: none; }
  .chat-welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 46px 20px 26px;
    text-align: center;
  }
  .chat-logo {
    width: 58px;
    height: 58px;
    margin-bottom: 10px;
    border: 1px solid #dfe3e9;
    border-radius: 18px;
    display: grid;
    place-items: center;
  }
  .chat-hi { font-size: 20px; font-weight: 600; }
  .chat-sub { font-size: 14px; }

    transform: translateY(101%);
    transition: transform .3s cubic-bezier(.4, 0, .2, 1);

  .group { display: flex; flex-direction: column; gap: 6px; }
  .group-title { padding-left: 4px; font-size: 12px; color: #9aa1ab; }

  /* 弹窗 */
  .alert-mask {
    position: absolute;
    inset: 0;
    z-index: 120;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(14, 17, 22, .28);
  }
  .alert-mask.on { display: flex; }
  .alert {
    width: 280px;
    overflow: hidden;
    border: 1px solid #dfe3e9;
    border-radius: 14px;
    background: #fff;
    text-align: center;
    box-shadow: 0 10px 30px rgba(14, 17, 22, .16);
  }
  .alert-title { padding: 18px 20px 0; font-size: 15px; font-weight: 600; }
  .alert-msg { padding: 8px 20px 18px; font-size: 12px; line-height: 1.6; color: #6b7280; }
  .alert-actions { display: flex; border-top: 1px solid #eef1f4; }
  .ab {
    flex: 1;
    height: 44px;
    border: 0;
    background: none;
    font-size: 13px;
    color: #0e1116;
    cursor: pointer;
  }
  .ab + .ab { border-left: 1px solid #eef1f4; }
  .ab--danger { color: #dc2626; }
  .alert-input {
    width: calc(100% - 40px);
    height: 40px;
    margin: 12px 20px 18px;
    padding: 0 12px;
    border: 1px solid #dfe3e9;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  .alert-list { max-height: 300px; overflow-y: auto; padding-bottom: 6px; text-align: left; }
  .alert-list .row { cursor: pointer; }
  .alert-list .row:active { background: #fafbfc; }
  .toast {
    position: absolute;
    left: 50%;
    bottom: 104px;
    z-index: 150;
    max-width: 300px;
    padding: 9px 14px;
    border-radius: 10px;
    background: rgba(14, 17, 22, .9);

    opacity: 0;
    transform: translate(-50%, 10px);

    pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .demo-hint {
    margin-top: 14px;
    font-size: 12px;

function taskMetaText(t) {
  if (t.status === 'running') return `${fmt(t.done)} / ${fmt(t.total)} ${t.unit} · ${t.remain}`;
  if (t.status === 'paused') return `${fmt(t.done)} / ${fmt(t.total)} ${t.unit} · 已暂停`;
  if (t.status === 'pending') return `${fmt(t.total)} ${t.unit} · 待开始`;
  if (t.status === 'done') return `${t.kind === 'material' ? '自动拷贝完成' : '备份完成'} · ${t.doneAt}`;
  return '';
}
function statusIcon(t) {
  if (t.status === 'running') return icon('pie', 12);
  if (t.status === 'paused') return icon('pause', 12);
  if (t.status === 'pending') return icon('dashed', 12);
  return icon('check', 12);
}
function taskButton(t) {
  if (t.status === 'running') return `<button class="cs-btn" type="button" onclick="event.stopPropagation();toggleTask('${t.id}')">暂停</button>`;
  if (t.status === 'paused') return `<button class="cs-btn" type="button" onclick="event.stopPropagation();toggleTask('${t.id}')">继续</button>`;
  if (t.status === 'pending' && t.conn === '已连接') return `<button class="cs-btn" type="button" onclick="event.stopPropagation();toggleTask('${t.id}')">开始</button>`;
  return '';
}
function jobHTML(t) {

    <div class="job-meta">
      <span class="job-state">${statusIcon(t)}<span>${esc(taskMetaText(t))}</span></span>
      ${taskButton(t)}
    </div>
  </article>`;
}

function statusHTML(t) {
  if (t.status === 'running') {
    return `<div class="card status-card">
      <div class="cs-row">${icon('pie', 16, 'cs-ic')}
        <span class="cs-num"><span class="v">${fmt(t.done)}</span><span class="u"> / ${fmt(t.total)} ${t.unit}</span></span>
        <span class="cs-size">${esc(t.size)}</span>
      </div>
      <div class="cs-meta"><span>${esc(t.speed)}</span><span>${esc(t.remain)}</span></div>
      <button class="cs-btn" type="button" onclick="toggleTask('${t.id}')">暂停</button>
    </div>`;
  }
  if (t.status === 'paused') {
    return `<div class="card status-card">
      <div class="cs-row">${icon('pause', 16, 'cs-ic')}
        <span class="cs-num"><span class="v">${fmt(t.done)}</span><span class="u"> / ${fmt(t.total)} ${t.unit}</span></span>
        <span class="cs-size">${esc(t.size)}</span>
      </div>
      <div class="cs-meta"><span>已暂停</span></div>
      <button class="cs-btn" type="button" onclick="toggleTask('${t.id}')">继续</button>
    </div>`;
  }
  if (t.status === 'pending') {
    const action = t.conn === '已连接'
      ? `<button class="cs-btn" type="button" onclick="toggleTask('${t.id}')">开始</button>` : '';
    return `<div class="card status-card ${action ? '' : 'noact'}">
      <div class="cs-row">${icon('clock', 16, 'cs-ic')}
        <span class="cs-num"><span class="v">${fmt(t.total)}</span><span class="u"> ${t.unit}</span></span>
        <span class="cs-size">${esc(t.size)}</span>
      </div>
      <div class="cs-meta"><span>待开始</span></div>
      ${action}
    </div>`;
  }
  return `<div class="card status-card noact">
    <div class="cs-row">${icon('check', 16, 'cs-ic')}
      <span class="cs-num"><span class="v">${fmt(t.total)}</span><span class="u"> ${t.unit}</span></span>
      <span class="cs-size">${esc(t.size)}</span>
    </div>
    <div class="cs-meta"><span>${t.kind === 'material' ? '自动拷贝完成' : '备份完成'}</span><span>${esc(t.doneAt || '')}</span></div>
  </div>`;
}
function diskHTML(d, conn, link) {
  if (!d) return '';

    return `<div class="card disk-files"><div class="disk-files-main slim">
      <div class="disk-files-head"><div class="disk-name">${esc(d.name)}</div></div>
      <div class="disk-files-foot"><div class="disk-status off">${icon('x', 12)}未连接</div></div>

  }
  return `<div class="card disk-files"><div class="disk-files-main">
    <div class="disk-files-head">
      <div class="disk-name">${esc(d.name)}</div>
      <button class="disk-open" type="button" onclick="toast('演示版不打开文件 App')">${link}${chev()}</button>

/* ---------- 导航 ---------- */
function updateChrome() {
  $('#tabbar').classList.toggle('hide', stack.length > 0);
}
function push(id) {
  stack.push(id);
  const el = $('#' + id);
  el.style.zIndex = String(10 + stack.length);
  el.classList.add('on');
  const content = el.querySelector('.content');
  if (content) content.scrollTop = 0;
  updateChrome();
}
function pop() {
  const id = stack.pop();
  if (!id) return;
  $('#' + id).classList.remove('on');
  if (!stack.length) {
    currentTaskId = null;
    currentWorkId = null;
  }
  updateChrome();
}
function clearStack() {
  stack.forEach(id => { const el = $('#' + id); if (el) el.classList.remove('on'); });
  stack = [];
  currentTaskId = null;
  currentWorkId = null;
  updateChrome();
}
function showTab(tab) {
  clearStack();
  state.tab = tab;
  $$('.screen.root').forEach(s => s.classList.toggle('on', s.id === 'scr-' + tab));
  $$('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  const idx = ['home', 'tasks', 'ai'].indexOf(tab);
  $('#tab-pill').style.transform = `translateX(${Math.max(0, idx) * 100}%)`;
}

function openTask(id) {
  currentTaskId = id;
  renderDetail();
  push('scr-detail');
}
function toggleTask(id) {
  const t = findTask(id);
  if (!t) return;
  if (t.status === 'running') {
    t.status = 'paused';
  } else if (t.status === 'paused') {
    t.status = 'running';
  } else if (t.status === 'pending') {
    if (t.conn !== '已连接') { toast('请先连接卡或磁盘'); return; }
    t.status = 'running';
    t.speed = '96 MB/s';
    t.remain = '剩余 5 分钟';
  } else {
    return;
  }
  refreshViews();
}
function refreshViews() {
  renderHome();
  renderTasks();
  if (stack.includes('scr-detail') && currentTaskId) {
    const el = $('#detail-content');
    const y = el.scrollTop;
    renderDetail();
    el.scrollTop = y;
  }
  if (stack.includes('scr-settings')) renderSettings();
  if (stack.includes('scr-work') && currentWorkId) {
    const el = $('#work-content');
    const y = el.scrollTop;
    renderWork();
    el.scrollTop = y;
  }
}

/* ---------- 设置 ---------- */
function openTaskSettings() {
  if (!currentTaskId) return;
  renderSettings();
  push('scr-settings');
}
function toggleFlag(el, flag) {
  const t = findTask(currentTaskId);
  if (!t) return;
  t[flag] = !t[flag];
  el.classList.toggle('off', !t[flag]);
}
function openRename() {
  const t = findTask(currentTaskId);
  if (!t) return;
  openDialog({
    title: '任务名称',
    input: t.name,
    buttons: [
      { label: '取消' },
      {
        label: '修改',
        onClick: value => {
          const name = (value || '').trim();
          if (!name) return;
          t.name = name;
          t.title = name;
          t.customName = true;
          refreshViews();
          toast('已修改');
        }
      }
    ]
  });
}
function openDiskPicker() {
  const t = findTask(currentTaskId);
  if (!t) return;
  openDialog({
    title: '变更磁盘',
    list: state.disks.map(d => ({ label: d.name, value: d.name, selected: d.name === t.target })),
    buttons: [{ label: '取消' }],
    onPick: item => {
      if (item.value === t.target) return;
      const d = diskByName(item.value);
      t.target = d.name;
      t.dstDisk = d;
      if (!t.customName) {
        t.name = `相册 → ${d.name}`;
        t.title = `相册→${d.name}`;
      }
      refreshViews();
      toast(`已切换至 ${d.name}`);
    }
  });
}
function confirmDelete() {
  const t = findTask(currentTaskId);
  if (!t) return;
  openDialog({
    title: '删除',
    message: t.kind === 'photos'
      ? '此操作无法恢复，<br>已备份的照片和视频不会被删除'
      : '此操作无法恢复，文件不会被删除',
    buttons: [
      { label: '取消' },
      {
        label: '删除',
        danger: true,
        onClick: () => {
          state.tasks = state.tasks.filter(x => x.id !== t.id);
          clearStack();
          showTab('home');
          renderHome();
          toast('已删除');
        }
      }
    ]
  });
}

/* ---------- 选择盘与新建 ---------- */
function pickReady() {
  const p = state.pick;
  return p.mode === 'photos' ? !!p.one : (!!p.src && !!p.dst && p.src !== p.dst);
}
function pickRowHTML(d, slot) {
  const on = state.pick[slot] === d.name;
  return `<div class="pick-row ${on ? 'on' : ''}" onclick="selectPick('${slot}','${d.name}')">
    <div class="pick-ico">${icon('disk', 20, 'lg')}</div>
    <div class="pick-main">
      <div class="pick-name">${esc(d.name)}</div>
      <div class="pick-meta">${esc(d.free)} · ${esc(d.total)}</div>
    </div>
    <span class="radio">${on ? `<svg class="st-ic" width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.4 2.4 4.8-5.2"/></svg>` : ''}</span>
  </div>`;
}
function renderPick() {
  const p = state.pick;
  if (p.mode === 'photos') {
    $('#pick-content').innerHTML = `<div class="section" style="gap:8px">
      <div class="pick-title">选择你的外置硬盘</div>
      <div class="card list">${DISKS.map(d => pickRowHTML(d, 'one')).join('')}</div>
    </div>`;
  } else {
    $('#pick-content').innerHTML = `
      <div class="section" style="gap:8px">
        <div class="pick-title">选择源磁盘</div>
        <div class="card list">${DISKS.map(d => pickRowHTML(d, 'src')).join('')}</div>
      </div>
      <div class="section" style="gap:8px">
        <div class="pick-title">选择目标磁盘</div>
        <div class="card list">${DISKS.map(d => pickRowHTML(d, 'dst')).join('')}</div>
      </div>`;
  }
  $('#pick-next').disabled = !pickReady();
}
function startPick(mode) {
  state.pick = { mode, one: null, src: null, dst: null };
  renderPick();
  push('scr-pick');
}
function selectPick(slot, name) {
  const p = state.pick;
  if (slot === 'src' && p.dst === name) { toast('源磁盘和目标磁盘不能相同'); return; }
  if (slot === 'dst' && p.src === name) { toast('源磁盘和目标磁盘不能相同'); return; }
  p[slot] = name;
  renderPick();
}
function pickNext() {
  if (!pickReady()) return;
  const p = state.pick;
  const src = p.mode === 'photos' ? null : diskByName(p.src);
  const dst = diskByName(p.mode === 'photos' ? p.one : p.dst);
  state.create = {
    mode: p.mode,
    src,
    dst,
    name: p.mode === 'photos' ? `相册 → ${dst.name}` : `${src.name} → ${dst.name}`,
    auto: true,
    photo: true,
    video: true,
    verify: false,
    customName: false
  };
  renderCreate();
  push('scr-create');
}
function renderCreate() {

    $('#create-content').innerHTML = `

      <div class="section">
        <div class="card list">

        <div class="hint">连接源盘和目标盘并打开 App 时，会进行自动拷贝</div>
      </div>

        <div class="card list"><div class="row"><span class="k">文件校验</span><span class="switch ${c.verify ? '' : 'off'}" onclick="toggleCreateFlag(this,'verify')"><i></i></span></div></div>

}
function toggleCreateFlag(el, flag) {
  state.create[flag] = !state.create[flag];
  el.classList.toggle('off', !state.create[flag]);
}
function renameCreate() {
  openDialog({
    title: '任务名称',
    input: state.create.name,
    buttons: [
      { label: '取消' },
      {
        label: '修改',
        onClick: value => {
          const name = (value || '').trim();
          if (!name) return;
          state.create.name = name;
          state.create.customName = true;
          renderCreate();
        }
      }
    ]
  });
}
function openCreateDiskPicker() {
  const c = state.create;
  openDialog({
    title: '变更磁盘',

    onPick: item => {

      c.dst = d;
      if (!c.customName) c.name = `相册 → ${d.name}`;
      renderCreate();
      toast(`已切换至 ${d.name}`);

}
function finishCreate() {
  const c = state.create;
  if (c.mode === 'photos') {
    state.tasks.unshift({
      id: uid(), kind: 'photos', title: c.customName ? c.name : `相册→${c.dst.name}`, name: c.name,

      auto: c.auto, photo: c.photo, video: c.video, verify: false, customName: c.customName
    });
  } else {
    state.tasks.unshift({

      status: 'running', done: 0, total: 326, unit: '个文件', size: '3.2 GB',
      speed: '28 MB/s', remain: '剩余 2 分钟', conn: '已连接',
      source: c.src.name, target: c.dst.name, srcDisk: c.src, dstDisk: c.dst, records: [],
      auto: c.auto, verify: c.verify, customName: c.customName

      if (!state.newTask.name) state.newTask.name = item.value.name;
      renderTaskNew();
    }
  });
}
function setNewTab(index) {
  state.newTask.tab = index;
  renderTaskNew();
}
function toggleAdvanced() {
  state.newTask.advanced = !state.newTask.advanced;
  renderTaskNew();
}
function renameNewTask() {
  openDialog({
    title: '任务名称',
    input: state.newTask.name || state.newTask.source?.name || '',

      { label: '取消' },
      { label: '修改', onClick: value => { const name = (value || '').trim(); if (!name) return; state.newTask.name = name; renderTaskNew(); } }

  });
}
function pickPriority() {
  openDialog({
    title: '选择任务优先级',
    list: ['立即执行', '排队执行'].map(x => ({ label: x, value: x, selected: x === state.newTask.priority })),
    buttons: [{ label: '取消' }],
    onPick: item => { state.newTask.priority = item.value; renderTaskNew(); }
  });
}
function setFileType(type) {

}
function toggleNewFlag(el, flag) {

  renderTaskNew();
}

    progress: 6,

/* ---------- 任务详情 ---------- */
function openWork(id) {
  currentWorkId = id;
  renderWork();
  push('scr-work');
}
function renderWork() {
  const t = state.work.find(w => w.id === currentWorkId);
  if (!t) return;
  $('#work-title').textContent = t.title;
  $('#work-content').innerHTML = `
    <div class="section">
      <div class="card list">
        <div class="row"><span class="k">大小</span><span class="v">${esc(t.size)}</span></div>
        <div class="row"><span class="k">文件数量</span><span class="v">${t.files} 个</span></div>
        <div class="row"><span class="k">创建时间</span><span class="v">${esc(t.at)}</span></div>
      </div>
    </div>
    <div class="section">
      ${t.steps.map(s => {
        let right = s.pct === 100 ? '完成' : s.pct === 0 ? '待开始' : `${s.pct}%`;

        return `<div class="card phase-card">
          <div class="phase-head"><span>${s.name}</span><span class="pct">${right}</span></div>

      }).join('')}
    </div>`;

    <button class="btn" type="button" onclick="toast('演示版不打开文件 App')">查看文件</button>
    ${t.status !== 'done' ? `<button class="btn primary" type="button" onclick="toggleWork()">${t.status === 'paused' ? '继续' : '暂停'}</button>` : ''}`;

function toggleWork() {
  const t = state.work.find(w => w.id === currentWorkId);
  if (!t || t.status === 'done') return;
  t.status = t.status === 'paused' ? 'running' : 'paused';
  renderTasks();
  renderWork();
}

  state.recSel[state.recTab][i] = !state.recSel[state.recTab][i];
  renderRecommend();

function setRecTab(t) {
  state.recTab = t;
  renderRecommend();
}
function recAct(kind) {
  const count = state.recSel[state.recTab].filter(Boolean).length;
  if (!count) { toast('请先选择图片'); return; }
  toast(kind === 'save' ? `已保存 ${count} 张到相册` : `已选择 ${count} 张，演示版不打开外部素材拷贝`);
}
function openChat() {
  renderChat();
  push('scr-chat');
  setTimeout(() => {
    const body = $('#chat-body');
    if (body) body.scrollTop = body.scrollHeight;
  }, 60);
}
function renderChat() {
  const body = $('#chat-body');
  if (!state.aiMessages.length) {
    body.innerHTML = `<div class="chat-welcome">
      <div class="chat-logo">${icon('spark', 28, 'lg')}</div>
      <div class="chat-hi">Hi～</div>
      <div class="chat-sub">我是您的修图智能助手</div>
      <div class="chat-tip">上传一张图片，告诉我您想如何修改吧！</div>
    </div>`;
  } else {
    body.innerHTML = state.aiMessages.map(m => `<div class="msg ${m.who}">${esc(m.text)}</div>`).join('');
  }
  body.scrollTop = body.scrollHeight;
}
function sendChat() {
  const input = $('#chat-input');
  const value = input.value.trim();
  if (!value) return;
  state.aiMessages.push({ who: 'user', text: value });
  input.value = '';
  renderChat();
  setTimeout(() => {
    state.aiMessages.push({ who: 'ai', text: '收到，演示版还不能真的修图。你可以继续告诉我想要的风格，比如「提亮一点，皮肤自然一些」。' });
    renderChat();
  }, 650);
}
function aiAsk() {
  const input = $('#ai-input');
  if (!input.value.trim()) return;
  toast('演示版暂不接入 AI 对话，可打开「AI 修图」体验');
}

/* ---------- 我的 ---------- */
function openSheet() { $('#sheet-layer').classList.add('open'); }
function closeSheet() { $('#sheet-layer').classList.remove('open'); }

/* ---------- 弹窗与提示 ---------- */
function openDialog(opt) {
  currentDialog = opt;
  const mask = $('#mask');
  let html = `<div class="alert" role="dialog" aria-modal="true">`;
  if (opt.title) html += `<div class="alert-title">${opt.title}</div>`;
  if (opt.message) html += `<div class="alert-msg">${opt.message}</div>`;
  if (opt.input !== undefined) {
    html += `<input class="alert-input" id="dlg-input" value="${esc(opt.input)}" onkeydown="if(event.key==='Enter')dlgConfirmInput()">`;
  }
  if (opt.list) {
    html += `<div class="alert-list">${opt.list.map((x, i) => `
      <div class="row" onclick="dlgPick(${i})">
        <span class="k">${esc(x.label)}</span>
        ${x.selected ? icon('check', 12) : ''}
      </div>`).join('')}</div>`;
  }
  const buttons = opt.buttons || [{ label: '取消' }];
  html += `<div class="alert-actions">${buttons.map((b, i) =>
    `<button class="ab ${b.danger ? 'ab--danger' : ''}" type="button" onclick="dlgBtn(${i})">${esc(b.label)}</button>`).join('')}</div>`;
  html += `</div>`;
  mask.innerHTML = html;
  mask.classList.add('on');
  setTimeout(() => { const input = $('#dlg-input'); if (input) input.focus(); }, 60);
}
function closeDialog() {
  const mask = $('#mask');
  mask.classList.remove('on');
  mask.innerHTML = '';
  currentDialog = null;
}
function dlgBtn(index) {
  const opt = currentDialog;
  if (!opt) return;
  const button = opt.buttons[index];
  const value = $('#dlg-input') ? $('#dlg-input').value : undefined;
  closeDialog();
  if (button && button.onClick) button.onClick(value);
}
function dlgConfirmInput() {
  if (!currentDialog) return;
  const index = (currentDialog.buttons || []).length - 1;
  if (index >= 0) dlgBtn(index);
}
function dlgPick(index) {
  const opt = currentDialog;
  if (!opt || !opt.list) return;
  const item = opt.list[index];
  closeDialog();
  if (opt.onPick) opt.onPick(item);
}
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1600);
}

/* ---------- 进度模拟 ---------- */
function simulate() {
  let changed = false;
  let completed = null;
  state.tasks.forEach(t => {
    if (t.status !== 'running') return;
    const step = Math.max(1, Math.round(t.total * 0.002));
    t.done = Math.min(t.total, t.done + step);
    changed = true;
    if (t.done >= t.total) {
      t.status = 'done';
      t.doneAt = `今天 ${timeHM()}`;
      t.remain = '';
      completed = t.title;
    }
  });
  state.work.forEach(t => {
    if (t.status !== 'running') return;
    t.progress = Math.min(100, t.progress + 2);
    t.steps[0].pct = t.progress;
    if (t.progress >= 100) {
      t.status = 'done';
      t.steps.forEach(s => { s.pct = 100; });
      completed = t.title;
    }
    changed = true;
  });
  if (!changed) return;
  renderHome();
  renderTasks();
  if (stack.includes('scr-detail') && currentTaskId) {
    const el = $('#detail-content');
    const y = el.scrollTop;
    renderDetail();
    el.scrollTop = y;
  }
  if (stack.includes('scr-settings')) renderSettings();
  if (stack.includes('scr-work') && currentWorkId) {
    const el = $('#work-content');
    const y = el.scrollTop;
    renderWork();
    el.scrollTop = y;
  }
  if (completed) toast(`${completed} 已完成`);
}

renderHome();
renderTasks();
renderChat();
updateChrome();
setInterval(simulate, 4000);

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  if ($('#mask').classList.contains('on')) return;
  if ($('#sheet-layer').classList.contains('open')) { closeSheet(); return; }
  if (stack.length) pop();
});
</script>
