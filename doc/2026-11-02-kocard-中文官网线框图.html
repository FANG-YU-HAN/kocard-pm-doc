<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kocard 中文官网线框图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #0e1116;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 24px 72px;
  }

  /* ---------- 文档头 ---------- */
  .doc { width: 874px; max-width: 100%; margin-bottom: 44px; }
  .doc h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .doc p { margin: 0; max-width: 820px; font-size: 12px; line-height: 1.8; color: #6b7280; }
  .doc .meta { margin-top: 8px; font-size: 11px; color: #9aa1ab; }

  /* ---------- 浏览器框与组件板 ---------- */
  .fig-block { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 13px; margin: 0; }
  .browser {
    width: 1120px;
    flex: none;
    zoom: .78;
    border: 1px solid #d7dce3;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
  }
  .board {
    width: 1120px;
    flex: none;
    zoom: .78;
    border: 1px solid #d7dce3;
    border-radius: 12px;
    background: #fff;
    padding: 30px 48px 40px;
  }
  .chrome {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 13px;
    background: #fafbfc;
    border-bottom: 1px solid #e6eaf0;
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 8px; height: 8px; border: 1px solid #d7dce3; border-radius: 50%; background: #eef1f5; }
  .url {
    position: absolute;
    left: 50%;
    top: 7px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 330px;
    height: 20px;
    border: 1px solid #e6eaf0;
    border-radius: 10px;
    background: #fff;
    font-size: 10px;
    color: #9aa1ab;
    letter-spacing: .02em;
  }
  .url svg { color: #b9c0c9; }

  .page { background: #fff; }
  .fig { margin: 0; font-size: 12px; color: #9aa1ab; text-align: center; letter-spacing: .04em; }
  .footnote { margin: 0; max-width: 690px; font-size: 11.5px; line-height: 1.9; color: #6b7280; text-align: center; }
  .sep { flex: none; width: 874px; max-width: 100%; height: 1px; margin: 46px 0; background: #e6eaf0; }

  /* ---------- 通用 ---------- */
  .media {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: #f5f7fa;
    border: 1px dashed #d7dce3;
    color: #8a9099;
    font-size: 12px;
    letter-spacing: .02em;
    line-height: 1.6;
    text-align: center;
  }
  .media .tag { position: absolute; top: 12px; right: 14px; font-size: 10px; color: #9aa1ab; letter-spacing: .02em; }
  .media .sub { font-size: 10.5px; color: #9aa1ab; }
  .play {
    width: 38px; height: 38px; flex: none;
    border: 1px solid #b9c0c9; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .play i { width: 0; height: 0; border-left: 9px solid #6b7280; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 36px;
    min-width: 132px;
    padding: 0 18px;
    border: 1px solid #d7dce3;
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
    color: #0e1116;
    white-space: nowrap;
  }
  .btn.solid { background: #eef1f5; border-color: #c9ced6; }
  .chip {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 11px;
    border: 1px solid #d7dce3;
    border-radius: 999px;
    background: #fff;
    font-size: 11px;
    color: #3f4650;
    white-space: nowrap;
  }
  .si { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icobox {
    width: 34px; height: 34px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #d7dce3; border-radius: 9px;
    background: #fff; color: #3f4650;
  }

  .sec { padding: 52px 48px; }
  .sec + .sec, .band + .band { border-top: 1px solid #eef1f5; }
  .sec-head { text-align: center; margin-bottom: 30px; }
  h2.h2 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; }
  .h2.c { text-align: center; }
  .sub { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: #3f4650; }
  .desc { margin: 12px 0 0; font-size: 13px; line-height: 1.85; color: #6b7280; }
  .desc.c { text-align: center; max-width: 760px; margin-left: auto; margin-right: auto; }
  .kicker { font-size: 13px; font-weight: 600; color: #6b7280; letter-spacing: .06em; }

  /* ---------- 导航 ---------- */
  .navwrap { position: relative; padding: 24px 48px 0; }
  .navpill {
    position: relative;
    display: flex;
    align-items: center;
    height: 72px;
    padding: 0 24px;
    border: 1px solid #d7dce3;
    border-radius: 12px;
    background: #fff;
  }
  .navlogo { font-size: 18px; font-weight: 700; letter-spacing: .06em; }
  .navlinks { margin-left: auto; display: flex; align-items: center; gap: 34px; font-size: 13px; color: #8a9099; }
  .navlinks .on { color: #0e1116; font-weight: 600; }
  .navlinks .ditlink { position: relative; padding-right: 7px; }
  .navlinks .ditlink i { position: absolute; top: -1px; right: 0; width: 4px; height: 4px; border-radius: 50%; background: #6b7280; }
  .dropdown {
    position: absolute;
    left: 50%;
    top: 46px;
    transform: translateX(-50%);
    width: 300px;
    border: 1px solid #d7dce3;
    border-radius: 10px;
    background: #fff;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    z-index: 3;
  }
  .ddlogo {
    position: relative;
    width: 44px; height: 44px; flex: none;
    border: 1px solid #d7dce3; border-radius: 12px;
    background: #f5f7fa;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
  }
  .ddlogo i {
    position: absolute; top: -5px; right: -11px;
    font-style: normal; font-size: 8px; color: #6b7280;
    border: 1px solid #d7dce3; border-radius: 8px;
    background: #fff; padding: 1px 4px;
  }
  .ddtitle { font-size: 13.5px; font-weight: 600; }
  .dddesc { margin-top: 4px; font-size: 11px; color: #8a9099; line-height: 1.5; }

  /* ---------- 页脚 ---------- */
  .footer { width: 1024px; border-top: 1px solid #e6eaf0; padding-top: 28px; }
  .fmain { display: flex; justify-content: space-between; gap: 60px; }
  .fleft { width: 380px; }
  .flogo { font-size: 16px; font-weight: 700; letter-spacing: .06em; }
  .fnote { margin-top: 10px; font-size: 11.5px; line-height: 1.7; color: #6b7280; }
  .qrs { display: flex; gap: 16px; margin-top: 18px; }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .qrbox { width: 84px; height: 84px; border: 1px dashed #d7dce3; background: #f5f7fa; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #9aa1ab; }
  .qr span { font-size: 10px; color: #9aa1ab; }
  .fcols { display: flex; gap: 76px; }
  .fcol h4 { margin: 0 0 11px; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .fcol a { display: block; margin-bottom: 8px; font-size: 11.5px; color: #6b7280; text-decoration: none; }
  .fbottom {
    margin-top: 26px; padding-top: 14px;
    border-top: 1px solid #eef1f5;
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 10.5px; color: #9aa1ab;
  }
  .comp-label { margin: 0 0 12px; font-size: 11px; color: #9aa1ab; letter-spacing: .04em; }
  .comp-label + .navpill { margin-bottom: 54px; }
  .comp-label + .navpill.hasdd { margin-bottom: 104px; }
  .board .footer { margin-top: 4px; }

  /* ---------- 页面首屏 ---------- */
  .phero {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    padding: 40px 48px 56px;
    min-height: 430px;
  }
  .phero .copy { max-width: 570px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .brandline { font-size: 26px; font-weight: 700; letter-spacing: .08em; }
  .herotitle { margin: 8px 0 0; font-size: 44px; line-height: 1.22; font-weight: 700; letter-spacing: -.01em; }
  .herodesc { margin: 12px 0 0; font-size: 14px; line-height: 1.8; color: #6b7280; }
  .herobtns { display: flex; gap: 12px; margin-top: 26px; }
  .heroart { width: 410px; height: 320px; flex: none; }

  /* ---------- 首页 ---------- */
  .videoband { padding: 0 48px 52px; }
  .video { height: 430px; }
  .twocards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .bigcard { border: 1px solid #e6eaf0; border-radius: 12px; overflow: hidden; background: #fff; }
  .bigcard .media { height: 290px; border: 0; border-bottom: 1px dashed #d7dce3; }
  .bigcard .pad { padding: 20px 22px 22px; }
  .bigcard h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .bigcard p { margin: 0; font-size: 12.5px; line-height: 1.75; color: #6b7280; }
  .more { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; font-size: 12px; color: #3f4650; }
  .orbit { height: 350px; margin-top: 26px; }
  .fgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-top: 16px; }
  .fcard {
    position: relative;
    grid-column: span 2;
    min-height: 150px;
    border: 1px dashed #d7dce3;
    border-radius: 10px;
    background: #f8f9fb;
    padding: 16px;
  }
  .fcard::after { content: "图片"; position: absolute; right: 14px; bottom: 10px; font-size: 10px; color: #b6bcc5; letter-spacing: .04em; }
  .fcard.w { grid-column: span 3; }
  .fcard h3 { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
  .fcard p { margin: 0; font-size: 11.5px; line-height: 1.7; color: #6b7280; }
  .multi { display: flex; gap: 46px; margin-top: 28px; }
  .tabs { width: 220px; flex: none; display: flex; flex-direction: column; gap: 20px; padding-top: 10px; }
  .tab { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #9aa1ab; }
  .tab i { width: 6px; height: 6px; border-radius: 50%; background: #d7dce3; }
  .tab.on { color: #0e1116; font-weight: 600; }
  .tab.on i { background: #0e1116; }
  .flow { flex: 1; min-width: 0; }
  .flow .media { height: 300px; }
  .steps { display: flex; align-items: flex-start; margin-top: 18px; }
  .step { width: 138px; flex: none; text-align: center; font-size: 11px; line-height: 1.55; color: #6b7280; }
  .step b {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; margin: 0 auto 8px;
    border: 1px solid #b9c0c9; border-radius: 50%;
    font-size: 11px; font-weight: 600; color: #0e1116;
  }
  .stepline { flex: 1; height: 1px; margin-top: 12px; background: #e0e4ea; }
  .split { display: flex; align-items: center; gap: 56px; padding: 52px 48px; }
  .split .copy { flex: 1; }
  .split .visual { width: 470px; flex: none; }
  .composite { position: relative; height: 360px; border: 1px solid #e6eaf0; border-radius: 16px; background: #fafbfc; padding: 26px; }
  .mini { width: 300px; border: 1px solid #d7dce3; border-radius: 10px; background: #fff; padding: 16px; }
  .mini + .mini { margin-top: 112px; margin-left: auto; }
  .mini h4 { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
  .mini p { margin: 0; font-size: 11px; line-height: 1.6; color: #6b7280; }
  .mini .thumb { height: 46px; margin-top: 10px; border: 1px dashed #e0e4ea; background: #fafbfc; }
  .workvisual { height: 300px; }
  .reasons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .reason {
    position: relative;
    height: 230px;
    border: 1px dashed #d7dce3;
    background: #f5f7fa;
    display: flex;
    align-items: flex-end;
    padding: 16px;
  }
  .reason .label { font-size: 14px; font-weight: 600; line-height: 1.45; white-space: pre-line; }
  .reason .plus {
    position: absolute; right: 14px; bottom: 14px;
    width: 28px; height: 28px;
    border: 1px solid #b9c0c9; border-radius: 50%;
    background: #fff; color: #6b7280;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .cobrand-banner {
    position: relative;
    height: 270px;
    border: 1px dashed #d7dce3;
    background: #f5f7fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    text-align: center;
  }
  .cobrand-banner .tag { position: absolute; top: 12px; right: 14px; font-size: 10px; color: #9aa1ab; }
  .cobrand-banner h2 { margin: 0 0 12px; font-size: 30px; font-weight: 700; }
  .cobrand-banner p { margin: 0; max-width: 780px; font-size: 12.5px; line-height: 1.8; color: #3f4650; }
  .iconrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 26px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11.5px; line-height: 1.5; color: #3f4650; text-align: center; }
  .ic .icobox { border-radius: 8px; }
  .brandrow {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 40px;
    margin-top: 26px; padding: 24px 40px;
    border-top: 1px solid #eef1f5; border-bottom: 1px solid #eef1f5;
  }
  .brandrow span { font-size: 12.5px; color: #9aa1ab; text-align: center; letter-spacing: .02em; }
  .center-btn { display: flex; justify-content: center; margin-top: 24px; }

  /* ---------- 手机端 ---------- */
  .phone {
    position: relative;
    width: 190px; height: 390px;
    padding: 9px;
    border: 1px solid #b9c0c9;
    border-radius: 28px;
    background: #fff;
  }
  .phone .notch { position: absolute; left: 50%; top: 15px; transform: translateX(-50%); width: 52px; height: 7px; border-radius: 4px; background: #e6eaf0; z-index: 2; }
  .phone .screen {
    height: 100%;
    border: 1px dashed #d7dce3;
    border-radius: 20px;
    background: #f8f9fb;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px;
    font-size: 10px; line-height: 1.6; color: #9aa1ab; text-align: center;
  }
  .phone .screen b { font-size: 11px; font-weight: 500; color: #6b7280; }
  .mrow { display: flex; align-items: center; gap: 64px; padding: 42px 48px; }
  .mrow.rev { flex-direction: row-reverse; }
  .mrow .copy { flex: 1; }
  .mrow .visual { width: 400px; flex: none; }
  .mrow h3 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
  .mrow p { margin: 0; font-size: 13px; line-height: 1.85; color: #6b7280; }
  .aihead { padding: 50px 48px 0; text-align: center; }
  .aiedit { padding: 28px 48px 0; }
  .aistage {
    position: relative;
    height: 450px;
    margin-top: 20px;
    border: 1px solid #eef1f5;
    border-radius: 14px;
    background: #fafbfc;
  }
  .aistage .phone { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 224px; height: 404px; }
  .aistage .phone .screen { justify-content: flex-start; padding-top: 34px; }
  .aistage .phone .screen b { font-size: 12px; color: #3f4650; }
  .shot {
    position: absolute;
    width: 146px; height: 96px;
    border: 1px dashed #d7dce3;
    background: #f5f7fa;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 7px;
    font-size: 10.5px; color: #6b7280;
  }
  .shot.s1 { left: 34px; top: 34px; }
  .shot.s2 { left: 20px; bottom: 40px; }
  .shot.s3 { right: 34px; top: 34px; }
  .shot.s4 { right: 20px; bottom: 40px; }
  .promptbar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: 330px; height: 38px;
    border: 1px solid #d7dce3; border-radius: 19px;
    background: #fff;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px;
    font-size: 11px; color: #9aa1ab;
  }
  .promptbar .send { margin-left: auto; width: 22px; height: 22px; border: 1px solid #d7dce3; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #6b7280; }
  .ai4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 48px 46px; }
  .ai4 .ic b { font-size: 13px; font-weight: 600; color: #0e1116; }
  .widevisual { height: 300px; margin-top: 24px; }
  .api {
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
    margin: 0 48px 46px; padding: 32px 36px;
    border: 1px solid #e6eaf0; border-radius: 12px;
    background: #fafbfc;
  }
  .api h3 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  .api p { margin: 0; font-size: 12px; line-height: 1.7; color: #6b7280; }
  .cloudicons { display: flex; gap: 9px; flex: none; }
  .cloudicons span { width: 38px; height: 38px; border: 1px solid #d7dce3; border-radius: 9px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #9aa1ab; }
  .final { display: flex; align-items: center; justify-content: space-between; gap: 56px; padding: 40px 48px 46px; }
  .final .copy { flex: 1; }
  .final .brandline { font-size: 30px; }
  .final .phones { display: flex; gap: 0; width: 430px; flex: none; align-items: flex-end; }
  .final .phones .phone { width: 200px; height: 410px; }
  .final .phones .phone + .phone { margin-left: -46px; margin-bottom: -18px; width: 176px; height: 360px; }
  .pricing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 48px 56px; }
  .plan { border: 1px solid #e6eaf0; border-radius: 12px; padding: 18px 18px 14px; background: #fff; }
  .plan.featured { border-color: #c9ced6; background: #fafbfc; }
  .tier { text-align: center; font-size: 12px; color: #6b7280; }
  .price { margin: 10px 0 3px; text-align: center; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .price small { font-size: 11px; font-weight: 400; color: #6b7280; }
  .pnote { min-height: 15px; text-align: center; font-size: 10.5px; color: #9aa1ab; }
  .credits { min-height: 20px; margin-top: 4px; text-align: center; font-size: 11px; color: #6b7280; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid #eef1f5; padding: 8px 2px; font-size: 11.5px; line-height: 1.4; }
  .prow .name { color: #3f4650; }
  .prow .yes { color: #0e1116; }
  .prow .no { color: #c9ced6; }
  .prow .soon, .prow .pay { color: #9aa1ab; font-size: 10.5px; }

  /* ---------- DIT版 ---------- */
  .dithead { display: flex; align-items: center; justify-content: space-between; padding: 22px 48px 12px; }
  .ditlogo { font-size: 14px; font-weight: 700; letter-spacing: .1em; }
  .ditlinks { display: flex; gap: 8px; }
  .ditlinks span { border: 1px solid #d7dce3; border-radius: 999px; padding: 6px 14px; font-size: 11px; color: #3f4650; }
  .dithero { display: flex; flex-direction: column; align-items: center; padding: 22px 48px 36px; text-align: center; }
  .kbadge {
    position: relative;
    width: 58px; height: 58px;
    border: 1px solid #b9c0c9; border-radius: 15px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 700;
  }
  .kbadge i { position: absolute; top: -6px; right: -13px; font-style: normal; font-size: 8px; color: #6b7280; border: 1px solid #d7dce3; border-radius: 8px; padding: 1px 5px; background: #fff; }
  .dithero h1 { margin: 16px 0 7px; font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
  .dithero .sub { font-size: 13px; }
  .ditbtns { display: flex; gap: 10px; margin-top: 18px; }
  .ditvideo { position: relative; height: 420px; margin: 0 48px; }
  .dband { display: flex; align-items: center; gap: 56px; padding: 46px 48px; }
  .dband.rev { flex-direction: row-reverse; }
  .dband .copy { flex: 1; }
  .dband .visual { width: 430px; flex: none; height: 300px; }
