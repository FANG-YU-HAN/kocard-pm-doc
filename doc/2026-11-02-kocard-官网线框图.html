<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kocard 官网线框图</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #0e1116;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 24px 72px;
  }

  /* ---------- 文档头 ---------- */
  .doc { width: 874px; max-width: 100%; margin-bottom: 44px; }
  .doc h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .doc p { margin: 0; max-width: 820px; font-size: 12px; line-height: 1.8; color: #6b7280; }
  .doc .key { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11.5px; color: #8a9099; }
  .doc .key i { width: 18px; height: 10px; border: 1px dashed #b9c0c9; border-radius: 2px; background: #f5f7fa; }

  /* ---------- 浏览器框 ---------- */
  .fig-block { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 13px; margin: 0; }
  .browser {
    width: 1120px;
    flex: none;
    zoom: .78;
    border: 1px solid #d7dce3;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
  }
  .chrome {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 13px;
    background: #fafbfc;
    border-bottom: 1px solid #e6eaf0;
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 8px; height: 8px; border: 1px solid #d7dce3; border-radius: 50%; background: #eef1f5; }
  .url {
    position: absolute;
    left: 50%;
    top: 7px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 300px;
    height: 20px;
    border: 1px solid #e6eaf0;
    border-radius: 10px;
    background: #fff;
    font-size: 10px;
    color: #9aa1ab;
    letter-spacing: .02em;
  }
  .url svg { color: #b9c0c9; }

  .page { background: #fff; }
  .fig { margin: 0; font-size: 12px; color: #9aa1ab; text-align: center; letter-spacing: .04em; }
  .footnote { margin: 0; max-width: 690px; font-size: 11.5px; line-height: 1.9; color: #6b7280; text-align: center; }
  .sep { flex: none; width: 874px; max-width: 100%; height: 1px; margin: 46px 0; background: #e6eaf0; }

  /* ---------- 通用 ---------- */
  .media {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f7fa;
    border: 1px dashed #d7dce3;
    color: #8a9099;
    font-size: 12px;
    letter-spacing: .02em;
    text-align: center;
  }
  .media-tag {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 10px;
    color: #9aa1ab;
    letter-spacing: .02em;
  }
  .sec { padding: 56px 48px; }
  .sec-head { text-align: center; margin-bottom: 34px; }
  .sec-head h2 { margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; }
  .sec-head .sub { margin: 10px 0 0; font-size: 16px; line-height: 1.5; }
  .sec-head .desc { max-width: 780px; margin: 12px auto 0; font-size: 15px; line-height: 1.65; color: #3f4650; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 38px;
    min-width: 146px;
    padding: 0 20px;
    border: 1px solid #d7dce3;
    border-radius: 8px;
    background: #eef1f5;
    font-size: 14px;
    color: #0e1116;
    white-space: nowrap;
  }

  /* ---------- 图1 首屏 ---------- */
  .announce {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 32px;
    padding: 0 26px;
    background: #f8f9fb;
    border-bottom: 1px solid #eef1f5;
    font-size: 11px;
    color: #6b7280;
  }
  .ann-side { flex: 1; display: flex; align-items: center; gap: 13px; }
  .ann-side.right { justify-content: flex-end; }
  .ann-mid { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-style: italic; }
  .social { display: inline-flex; color: #6b7280; }
  .site-head { display: flex; align-items: center; height: 64px; padding: 0 48px; }
  .brand { width: 180px; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .nav { flex: 1; display: flex; justify-content: center; gap: 36px; font-size: 14px; }
  .search { margin-left: auto; display: inline-flex; color: #0e1116; }

  .hero {
    position: relative;
    display: flex;
    align-items: center;
    height: 520px;
    padding: 0 64px;
    background: #f6f7f9;
    border-top: 1px solid #eef1f5;
    border-bottom: 1px solid #eef1f5;
    overflow: hidden;
  }
  .hero-copy { position: relative; z-index: 2; max-width: 520px; }
  .chips { display: flex; gap: 10px; margin-bottom: 26px; }
  .chips span {
    display: inline-flex;
    align-items: center;
    height: 26px;
    padding: 0 13px;
    border: 1px solid #d7dce3;
    border-radius: 13px;
    background: #fff;
    font-size: 11px;
    color: #3f4650;
  }
  .wordmark { font-size: 58px; line-height: .95; font-weight: 800; letter-spacing: .055em; }
  .tagline { margin: 16px 0 0; font-size: 22px; font-weight: 600; }
  .hero-actions { display: flex; gap: 12px; margin-top: 30px; }
  .hero-actions .btn { min-width: 128px; }
  .hero-art { position: absolute; right: 54px; bottom: 54px; z-index: 1; width: 380px; height: 320px; color: #b9c0c9; }
  .hero .media-tag { top: 16px; right: 20px; }

  /* ---------- 图2 视频 ---------- */
  .video-sec { padding: 56px 48px; }
  .video {
    position: relative;
    height: 576px;
    border: 1px dashed #d7dce3;
    border-radius: 8px;
    background: #f5f7fa;
    overflow: hidden;
  }
  .video .media-tag { top: 16px; right: auto; left: 18px; }
  .play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    border: 1px solid #c9d0d8;
    border-radius: 50%;
    background: #fff;
    color: #6b7280;
  }
  .play svg { margin-left: 3px; }
  .video-meta {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #6b7280;
  }
  .video-icons { display: flex; align-items: center; gap: 12px; color: #8a9099; }
  .video-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #e6eaf0; }
  .video-progress i { display: block; width: 8%; height: 100%; background: #8a9099; }

  /* ---------- 图3 生态 ---------- */
  .eco-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
  .eco-card { text-align: center; }
  .eco-media { height: 330px; border-radius: 8px; }
  .eco-card h3 { margin: 18px 0 8px; font-size: 18px; font-weight: 600; }
  .eco-card p { max-width: 420px; margin: 0 auto 18px; font-size: 15px; line-height: 1.55; color: #3f4650; }

  /* ---------- 图4 App 主视觉 ---------- */
  .app-visual {
    position: relative;
    height: 500px;
    border: 1px dashed #d7dce3;
    border-radius: 10px;
    background: #f5f7fa;
    overflow: hidden;
  }
  .phone-ui {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 172px;
    height: 352px;
    padding: 16px 12px;
    border: 1.5px solid #b9c0c9;
    border-radius: 26px;
    background: #fff;
  }
  .p-notch { width: 58px; height: 8px; margin: 0 auto 12px; border-radius: 5px; background: #eef1f5; }
  .p-user { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .p-user i { flex: none; width: 18px; height: 18px; border: 1px solid #d7dce3; border-radius: 50%; background: #f5f7fa; }
  .p-user b { display: block; width: 56px; height: 5px; border-radius: 3px; background: #d7dce3; }
  .p-tile { display: flex; gap: 7px; margin-bottom: 8px; padding: 8px; border: 1px solid #e6eaf0; border-radius: 6px; }
  .p-tile i { flex: none; width: 20px; height: 20px; border: 1px solid #d7dce3; border-radius: 5px; background: #f5f7fa; }
  .p-tile div { flex: 1; padding-top: 1px; }
  .p-tile span { display: block; height: 5px; margin-bottom: 5px; border-radius: 3px; background: #d7dce3; }
  .p-tile span:last-child { width: 62%; margin-bottom: 0; background: #e6eaf0; }
  .p-tabbar { display: flex; justify-content: space-around; margin-top: 10px; padding-top: 9px; border-top: 1px solid #eef1f5; }
  .p-tabbar i { width: 14px; height: 4px; border-radius: 2px; background: #d7dce3; }
  .fcard {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 9px;
    width: 176px;
    height: 46px;
    padding: 0 12px;
    border: 1px solid #d7dce3;
    border-radius: 8px;
    background: #fff;
    font-size: 12px;
  }
  .fcard i { flex: none; width: 20px; height: 20px; border: 1px solid #d7dce3; border-radius: 5px; background: #f5f7fa; }
  .f1 { left: 64px; top: 76px; }
  .f2 { left: 64px; bottom: 76px; }
  .f3 { right: 64px; top: 76px; }
  .f4 { right: 64px; bottom: 76px; }

  /* ---------- 图5 功能卡 ---------- */
  .feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .feat-grid.two { grid-template-columns: 1fr 1fr; margin-top: 18px; }
  .feat {
    display: flex;
    flex-direction: column;
    min-height: 252px;
    padding: 20px;
    border: 1px solid #e1e5eb;
    border-radius: 10px;
    background: #fff;
  }
  .feat h3 { min-height: 44px; margin: 0 0 6px; font-size: 16px; line-height: 1.35; font-weight: 600; }
  .feat p { min-height: 40px; margin: 0; font-size: 13px; line-height: 1.5; color: #6b7280; }
  .feat .media { flex: 1; min-height: 110px; margin-top: 14px; }
  .feat-grid.two .feat { min-height: 236px; }
  .feat-grid.two .feat .media { min-height: 116px; }

  /* ---------- 图6 云端演示 ---------- */
  .demo {
    position: relative;
    height: 430px;
    border: 1px dashed #d7dce3;
    border-radius: 12px;
    background: #f7f8fa;
    overflow: hidden;
  }
  .file-art { position: absolute; left: 46px; top: 56px; width: 130px; height: 100px; color: #b9c0c9; }
  .demo-cloud { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); color: #b9c0c9; }
  .demo-check { position: absolute; left: 86%; top: 78px; transform: translateX(-50%); color: #b9c0c9; }
  .demo-steps { position: absolute; left: 96px; right: 96px; top: 238px; display: flex; align-items: center; }
  .dot {
    flex: none;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 1px solid #b9c0c9;
    border-radius: 50%;
    background: #fff;
    font-size: 12px;
    color: #3f4650;
  }
  .line { flex: 1; height: 2px; margin: 0 2px; background: #dfe3e9; }
  .line.fill { background: #0e1116; }
  .step-label { position: absolute; top: 282px; transform: translateX(-50%); text-align: center; }
  .step-label.one { left: 14%; width: 190px; }
  .step-label.two { left: 50%; width: 290px; }
  .step-label b { display: block; font-size: 15px; font-weight: 600; }
  .step-label span { display: block; margin-top: 4px; font-size: 13px; line-height: 1.35; color: #6b7280; }
  .demo-title { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 15px; font-weight: 600; }

  /* ---------- 图7 全宽横幅 ---------- */
  .banner-a {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    height: 606px;
    padding: 0 72px;
    background: #f6f7f9;
    border-top: 1px dashed #d7dce3;
    border-bottom: 1px dashed #d7dce3;
    overflow: hidden;
  }
  .banner-a .copy { max-width: 460px; }
  .banner-a h2 { margin: 0; font-size: 44px; line-height: 1.08; font-weight: 700; letter-spacing: -.02em; }
  .banner-a p { max-width: 440px; margin: 18px 0 0; font-size: 14px; line-height: 1.7; color: #3f4650; }
  .banner-cards { display: flex; flex-direction: column; gap: 14px; width: 430px; }
  .bcard {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 140px;
    padding: 16px 18px;
    border: 1px solid #d7dce3;
    border-radius: 10px;
    background: #fff;
  }
  .bcard .mini-art {
    flex: none;
    display: grid;
    place-items: center;
    width: 112px;
    height: 92px;
    border: 1px dashed #d7dce3;
    border-radius: 6px;
    background: #f8f9fb;
    font-size: 10px;
    color: #9aa1ab;
  }
  .bcard h4 { margin: 0 0 5px; font-size: 17px; font-weight: 600; }
  .bcard p { margin: 0; font-size: 12px; line-height: 1.55; color: #6b7280; }

  .banner-b {
    position: relative;
    display: flex;
    align-items: center;
    gap: 56px;
    height: 451px;
    padding: 0 72px 0 64px;
    background: #f6f7f9;
    border-bottom: 1px dashed #d7dce3;
    overflow: hidden;
  }
  .banner-b .media { flex: none; width: 470px; height: 330px; border-radius: 8px; }
  .banner-b .copy { max-width: 400px; }
  .banner-b h2 { margin: 0; font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
  .banner-b .sub { margin: 14px 0 0; font-size: 15px; line-height: 1.7; color: #3f4650; }
  .banner-b .media-tag { top: 14px; left: 16px; right: auto; }

  /* ---------- 图8 评价 ---------- */
  .testi { padding: 56px 48px 48px; text-align: center; }
  .quotemark { display: block; margin: 0 auto 22px; color: #0e1116; }
  .quote { max-width: 860px; margin: 0 auto; font-size: 24px; line-height: 1.55; font-weight: 500; letter-spacing: -.01em; }
  .avatar {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    margin: 28px auto 0;
    border: 1px solid #d7dce3;
    border-radius: 50%;
    background: #f5f7fa;
    color: #9aa1ab;
  }
  .tname { margin-top: 10px; font-size: 13px; color: #3f4650; }
  .stars { margin-top: 6px; font-size: 12px; letter-spacing: 4px; }
  .tdots { display: flex; justify-content: center; gap: 10px; margin-top: 26px; }
  .tdots i { width: 6px; height: 6px; border-radius: 50%; background: #c9ced6; }
  .tdots i.on { width: 7px; height: 7px; border: 1px solid #0e1116; background: #fff; }

  /* ---------- 图9 Why Choose ---------- */
  .why { padding: 56px 48px 64px; }
  .why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 34px; }
  .why-card {
    position: relative;
    height: 302px;
    border: 1px solid #dfe3e9;
    border-radius: 10px;
    background: #f5f7fa;
    overflow: hidden;
  }
  .why-card::before {
    content: "";
    position: absolute;
    inset: 10px 10px 86px;
    border: 1px dashed #d7dce3;
    border-radius: 6px;
    pointer-events: none;
  }
  .why-card .ph-label { position: absolute; left: 20px; top: 20px; font-size: 10px; color: #9aa1ab; }
  .why-card .cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 76px;
    padding: 0 14px;
    background: #e9edf2;
  }
  .why-card h3 { max-width: 132px; margin: 0; font-size: 15px; line-height: 1.25; font-weight: 600; }
  .plus {
    flex: none;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border: 1px solid #c9d0d8;
    border-radius: 50%;
    background: #fff;
    font-size: 15px;
    line-height: 1;
    color: #0e1116;
  }

  /* ---------- 图10 社区 ---------- */
  .community { padding: 56px 48px; text-align: center; }
  .comm-grid { display: flex; justify-content: center; gap: 26px; margin-top: 32px; }
  .comm-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 200px;
    height: 120px;
    border: 1px solid #e1e5eb;
    border-radius: 10px;
    background: #fafbfc;
  }
  .comm-card .ico {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid #d7dce3;
    border-radius: 50%;
    background: #fff;
    color: #3f4650;
  }
  .comm-card span { font-size: 13px; }

  /* ---------- 图11 服务条 + 页脚 ---------- */
  .footer-shell { background: #f6f7f9; border-radius: 20px; padding: 0 48px 36px; }
  .service { display: grid; grid-template-columns: repeat(4, 1fr); padding: 38px 0 24px; }
  .service-item { display: flex; gap: 10px; padding: 0 22px; border-left: 1px solid #e1e5eb; }
  .service-item:first-child { border-left: 0; padding-left: 0; }
  .service-item .ico { flex: none; margin-top: 2px; color: #3f4650; }
  .service-item h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .service-item p { margin: 0; font-size: 12px; line-height: 1.5; color: #6b7280; }

  .foot-main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 64px; padding: 44px 0 16px; }
  .foot-left { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px; }
  .foot-col h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .foot-col span { display: block; margin: 8px 0; font-size: 12.5px; color: #3f4650; }
  .foot-contact { grid-column: 1; margin-top: 36px; }
  .foot-contact h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .foot-contact span { font-size: 13px; color: #3f4650; text-decoration: underline; text-underline-offset: 3px; }
  .foot-right { border-left: 1px solid #e1e5eb; padding-left: 56px; }
  .foot-right h4 { margin: 0 0 14px; font-size: 11px; font-weight: 700; letter-spacing: .09em; }
  .news-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 40px;
    padding: 0 10px 0 14px;
    border: 1px solid #d7dce3;
    border-radius: 8px;
    background: #fff;
    font-size: 12px;
    color: #9aa1ab;
  }
  .news-field span {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #f2f4f7;
    color: #3f4650;
  }
  .foot-note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.6; color: #6b7280; }
  .foot-social { display: flex; gap: 14px; margin-top: 36px; color: #3f4650; }
  .copyright {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 8px 24px;
    font-size: 11px;
    color: #8a9099;
  }
  .copyright .links { display: flex; gap: 14px; flex-wrap: wrap; }
  .copyright u { text-underline-offset: 2px; }

  @media (max-width: 940px) { .browser { zoom: .68; } }
  @media (max-width: 780px) { .browser { zoom: .56; } }
  @media (max-width: 640px) { .browser { zoom: .46; } }
  @media (max-width: 520px) { .browser { zoom: .38; } }
  @media (max-width: 430px) { .browser { zoom: .3; } }
</style>
</head>
<body>

<header class="doc">
  <h1>Kocard 官网线框图</h1>
  <p>桌面端 · 依据 2026-11-02 线上 kocard.io 整理。11 张图是同一个长页面的连续分段，只表达结构、文案层级与模块关系。官网大量文案直接烘焙在图片里，本稿把图里的信息拆成线框结构；不含配色、图片与动效。</p>
  <p class="key"><i></i>虚线框为图片 / 视频占位</p>
</header>

<!-- 图1 -->
<figure class="fig-block">
  <div class="browser">
    <div class="chrome">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="url">
        <svg width="9" height="11" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="6" width="9" height="6.5" rx="1.5"/><path d="M3.5 6V4.2a2.5 2.5 0 0 1 5 0V6"/></svg>
        kocard.io
      </span>
    </div>
    <div class="page">
