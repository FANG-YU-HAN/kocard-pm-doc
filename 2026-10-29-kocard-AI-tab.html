<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Kocard AI tab</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #0e1116;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
  }
  .phone {
    position: relative;
    width: 402px;
    height: 874px;
    zoom: 0.9;
    border: 1px solid #d7dce3;
    border-radius: 52px;
    background: #fff;
    overflow: hidden;
  }
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    border: 1px solid #d7dce3;
    border-radius: 18px;
  }
  .status {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px 0 40px;
  }
  .time { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .status-icons { display: flex; align-items: center; gap: 6px; }

  .header {
    height: 52px;
    margin-top: 6px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-title { font-size: 20px; font-weight: 600; }
  .avatar {
    width: 32px;
    height: 32px;
    border: 1px solid #d7dce3;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    color: #0e1116;
  }

  .content {
    padding: 20px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    border: 1px solid #dfe3e9;
    border-radius: 16px;
    background: #fff;
  }

  .ask {
    height: 140px;
    padding: 16px 12px 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid #dfe3e9;
    border-radius: 16px;
    background: #fff;
  }
  .ask input {
    width: 100%;
    height: 22px;
    padding: 0;
    border: 0;
    outline: 0;
    background: none;
    font: inherit;
    font-size: 14px;
    color: #0e1116;
  }
  .ask input::placeholder { color: #9aa1ab; }
  .ask-foot { display: flex; align-items: center; justify-content: space-between; }
  .ask-tools { display: flex; align-items: center; gap: 8px; }
  .ask-attach {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid #dfe3e9;
    border-radius: 50%;
    background: none;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .ask-model {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid #dfe3e9;
    border-radius: 14px;
    background: none;
    font: inherit;
    font-size: 12px;
    color: #0e1116;
    cursor: pointer;
  }
  .ask-send {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #f1f3f6;
    display: grid;
    place-items: center;
  }

  .h0-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .h0-small { height: 180px; padding: 24px 30px 0 18px; display: flex; flex-direction: column; gap: 20px; }
  .h0-ic { flex: none; width: 32px; height: 32px; display: grid; place-items: center; }
  .h0-tx { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .h0-t { font-size: 16px; font-weight: 600; line-height: 1.25; }
  .h0-s { font-size: 10px; line-height: 1.5; color: #8a9099; }

  .tabbar {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 34px;
    height: 58px;
    border: 1px solid #dfe3e9;
    border-radius: 29px;
    background: #fff;
    display: flex;
    align-items: center;
  }
  .tabbar .pill {
    position: absolute;
    left: 4px;
    top: 4px;
    bottom: 4px;
    width: calc((100% - 8px) / 3);
    border: 1px solid #0e1116;
    border-radius: 25px;
    transform: translateX(200%);
  }
  .tab {
    position: relative;
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: #8a9099;
  }
  .tab.active { color: #0e1116; font-weight: 600; }

  .home-indicator {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    border-radius: 3px;
    background: #0e1116;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="island"></div>
    <div class="status">
      <span class="time">9:41</span>
      <span class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="#0e1116"/>
          <rect x="4.8" y="5.8" width="3" height="6.2" rx="1" fill="#0e1116"/>
          <rect x="9.6" y="3.4" width="3" height="8.6" rx="1" fill="#0e1116"/>
          <rect x="14.4" y="1" width="3" height="11" rx="1" fill="#0e1116"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#0e1116" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path d="M1.5 4.2a9 9 0 0 1 13 0"/>
          <path d="M4 6.9a5.6 5.6 0 0 1 8 0"/>
          <path d="M6.5 9.5a2.2 2.2 0 0 1 3 0"/>
        </svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true">
          <rect x="0.75" y="0.75" width="19.5" height="10.5" rx="3" stroke="#0e1116" stroke-width="1.2"/>
          <rect x="2.5" y="2.5" width="11" height="7" rx="1.6" fill="#0e1116"/>
          <path d="M21.8 4.2v3.6" stroke="#0e1116" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
    </div>

    <div class="header">
      <div class="page-title">Kocard AI</div>
      <div class="avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0e1116" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="9" r="3.6"/>
          <path d="M4.8 20c0-3.4 3.2-6 7.2-6s7.2 2.6 7.2 6"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="ask">
        <input type="text" placeholder="问问 AI…" aria-label="问问 AI">
        <div class="ask-foot">
          <div class="ask-tools">
            <button class="ask-attach" type="button" aria-label="添加附件">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#0e1116" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
                <path d="M6 1v10M1 6h10"/>
              </svg>
            </button>
            <button class="ask-model" type="button">
              豆包
              <svg width="8" height="5" viewBox="0 0 8 5" fill="none" stroke="#9aa1ab" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 1l3 3 3-3"/>
              </svg>
            </button>
          </div>
          <span class="ask-send">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9aa1ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 13V3.4"/>
              <path d="M3.6 7.8L8 3.4l4.4 4.4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="h0-pair">
        <div class="card h0-small">
          <div class="h0-ic">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e1116" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="7" width="13" height="12" rx="2.2"/>
              <circle cx="8.2" cy="11.2" r="1.2"/>
              <path d="M3.5 16.4l4-3.6 3.1 2.7 2.3-2 3.6 3.1"/>
              <path d="M19.2 2.8l.6 1.7 1.7.6-1.7.6-.6 1.7-.6-1.7-1.7-.6 1.7-.6z"/>
            </svg>
          </div>
          <div class="h0-tx">
            <div class="h0-t">AI 推荐</div>
            <div class="h0-s">筛选并推荐您可能喜欢的图片</div>
          </div>
        </div>
        <div class="card h0-small">
          <div class="h0-ic">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e1116" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.4 20.6L13.6 10.4"/>
              <path d="M12.3 9.1l2.6 2.6"/>
              <path d="M18.6 3.2v3.2M17 4.8h3.2"/>
              <path d="M7.6 3.4v2.4M6.4 4.6h2.4"/>
            </svg>
          </div>
          <div class="h0-tx">
            <div class="h0-t">AI 修图</div>
            <div class="h0-s">Agent 修图，一句话帮您精致美颜</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <div class="pill"></div>
      <div class="tab">首页</div>
      <div class="tab">任务</div>
      <div class="tab active">AI</div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
